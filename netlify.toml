[build]
  command = "npm run build"
  publish = "dist"
  # Skip the deploy when a commit only changes parts of the Swift companion package the site doesn't use.
  # Sources/Exercises is bundled (the console's editor starts from those stubs), so it still deploys.
  # On the first build there's no cached commit, git diff fails, and the build runs as normal.
  ignore = "git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- . ':(exclude)dsa-swift/Sources/DSAKit' ':(exclude)dsa-swift/Sources/Solutions' ':(exclude)dsa-swift/Tests' ':(exclude)dsa-swift/Examples' ':(exclude)dsa-swift/Package.swift' ':(exclude)dsa-swift/README.md'"

[build.environment]
  # Vite 7 needs Node 20.19+ or 22.12+; pinning keeps Netlify builds the same as local ones
  NODE_VERSION = "22"

[[redirects]]
  from = "/blogs"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/build"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/privacy"
  to = "/index.html"
  status = 200

# The private learning console. Not linked anywhere and never indexed.
[[redirects]]
  from = "/dsa"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/dsa/*"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/projects"
  to = "/index.html"
  status = 200

# The app still renders its 404 page, but crawlers now get a real 404 status for unknown URLs
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 404
