[build]
  command = "npm run build"
  publish = "dist"
  # Skip the deploy when a commit only changes parts of the Swift companion package the site doesn't use.
  # Each package's Sources/Exercises is bundled (the console's editor starts from those stubs), so it still deploys.
  # On the first build there's no cached commit, git diff fails, and the build runs as normal.
  ignore = "git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- . ':(exclude)dsa-swift/Sources/DSAKit' ':(exclude)dsa-swift/Sources/Solutions' ':(exclude)dsa-swift/Tests' ':(exclude)dsa-swift/Examples' ':(exclude)dsa-swift/Package.swift' ':(exclude)dsa-swift/README.md' ':(exclude)design-swift/Sources/DesignKit' ':(exclude)design-swift/Sources/Solutions' ':(exclude)design-swift/Tests' ':(exclude)design-swift/Examples' ':(exclude)design-swift/Package.swift' ':(exclude)design-swift/README.md'"

[build.environment]
  # Vite 7 needs Node 20.19+ or 22.12+, and the Firebase 13.4 packages declare Node 24.12+; pinning keeps
  # every Netlify build on the same major version
  NODE_VERSION = "24"
  # The build bundles ~5,500 modules (mostly course content) and needs more than Node's default ~2 GB heap there
  NODE_OPTIONS = "--max-old-space-size=4096"

[[redirects]]
  from = "/blogs"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/build"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/privacy"
  to = "/index.html"
  status = 200

# The private learning console (both courses) keeps its noindex headers.
[[redirects]]
  from = "/dsa"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/dsa/*"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/design"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/design/*"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/projects"
  to = "/index.html"
  status = 200

# The app still renders its 404 page, but crawlers now get a real 404 status for unknown URLs
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 404
