[build]
  command = "npm run build"
  publish = "dist"
  # Skip the deploy when a commit only changes the Swift companion package, which isn't part of the site.
  # On the first build there's no cached commit, git diff fails, and the build runs as normal.
  ignore = "git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- . ':(exclude)dsa-swift'"

[build.environment]
  # Vite 7 needs Node 20.19+ or 22.12+; pinning keeps Netlify builds the same as local ones
  NODE_VERSION = "22"

[[redirects]]
  from = "/blogs"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/build"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/privacy"
  to = "/index.html"
  status = 200

# The private learning console. Not linked anywhere and never indexed.
[[redirects]]
  from = "/dsa"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/dsa/*"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/projects"
  to = "/index.html"
  status = 200

# The app still renders its 404 page, but crawlers now get a real 404 status for unknown URLs
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 404
