[build]
  command = "npm run build"
  publish = "dist"

[[redirects]]
  from = "/blogs"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/build"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/privacy"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/projects"
  to = "/index.html"
  status = 200

# The app still renders its 404 page, but crawlers now get a real 404 status for unknown URLs
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 404
