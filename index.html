  <link rel="icon" type="image/png" sizes="32x32" href="/assets/favicon.png" />
  <link rel="apple-touch-icon" href="/assets/apple-touch-icon.png" />

  <!--seo-jsonld-->

  <!-- Keeps the crawlable content below from flashing for people, until React replaces it -->
  <script>document.documentElement.classList.add('js')</script>
  <style>
    .js #seo-content { visibility: hidden; }
    #seo-content { max-width: 46rem; margin: 0 auto; padding: 2rem 1.25rem; line-height: 1.6; }
    #seo-content h1, #seo-content h2, #seo-content h3 { font-weight: 600; margin: 1.5rem 0 0.5rem; }
    #seo-content h1 { font-size: 2rem; }
    #seo-content h2 { font-size: 1.4rem; }
    #seo-content a { text-decoration: underline; }
    #seo-content li { margin-bottom: 0.6rem; }
  </style>
</head>

<body>
  <!-- Hidden Netlify Form for Build Bots -->
  <form name="contact" netlify netlify-honeypot="bot-field" hidden>
    <input type="text" name="bot-field" />
    <input type="text" name="name" />
    <input type="email" name="email" />
    <textarea name="message"></textarea>
  </form>
  <form name="feedback" netlify netlify-honeypot="bot-field" hidden>
    <input type="text" name="bot-field" />
    <input type="text" name="rating" />
    <textarea name="message"></textarea>
    <input type="email" name="email" />
    <input type="text" name="page" />
  </form>

  <div id="root"><!--seo-content--></div>
  <script type="module" src="/src/main.jsx"></script>
</body>

</html>
